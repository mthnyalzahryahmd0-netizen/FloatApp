workflows:
  android-apk:
    name: FloatApp Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build installable APK
        script: |
          gradle --version
          gradle --no-daemon --stacktrace assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FloatApp.apk
    artifacts:
      - app/build/outputs/apk/debug/FloatApp.apk
